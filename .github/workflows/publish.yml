name: publish audit

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit the topic
        uses: ./
        with:
          args: --bands --json --out audit.json
      - name: Compose the summary
        run: node scripts/summary.mjs audit.json summary.md
      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest topic audit" --notes "Rolling nightly audit of the dsh-plugin topic."
          gh release upload latest audit.json --clobber
          gh release edit latest --notes-file summary.md